<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7D1D3B">
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
.authbox{display:flex;align-items:center;gap:8px}.authbox .who{font-size:.85rem;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.authbox{order:2}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<title>IELTS Ruang Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: answer-sheet study desk — sticky header with section tabs, one working column (max 1080px); status = OMR-style bubbles filled by level. */
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --sunk:#EDEFEC; --ink:#1B1F1D; --muted:#5F6763; --line:#DCE0DC;
  --accent:#7D1D3B; --accent-ink:#FFFFFF; --accent-soft:#F4E6EA;
  --s0:#9AA19D; --s1:#C2412D; --s1-soft:#FBE9E5; --s2:#B57A0E; --s2-soft:#FAF0DA; --s3:#2B7A53; --s3-soft:#E1F1E8;
  --shadow:0 1px 2px rgba(20,24,22,.06),0 6px 24px rgba(20,24,22,.06);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1A1E1C; --sunk:#222826; --ink:#E6EAE7; --muted:#9BA5A0; --line:#2E3532;
  --accent:#E58AA4; --accent-ink:#2A0C16; --accent-soft:#3A2129;
  --s0:#6E7773; --s1:#F0826C; --s1-soft:#3B221D; --s2:#E3B04E; --s2-soft:#38301C; --s3:#6CC897; --s3-soft:#1D3328;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1A1E1C; --sunk:#222826; --ink:#E6EAE7; --muted:#9BA5A0; --line:#2E3532;
  --accent:#E58AA4; --accent-ink:#2A0C16; --accent-soft:#3A2129;
  --s0:#6E7773; --s1:#F0826C; --s1-soft:#3B221D; --s2:#E3B04E; --s2-soft:#38301C; --s3:#6CC897; --s3-soft:#1D3328;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:clamp(1.5rem,3.2vw,2rem)}
h3{font-size:1.2rem;margin-top:1.6rem;margin-bottom:.5rem}
p{margin:.4rem 0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.brand .mark{font-family:var(--f-mono);font-size:.7rem;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;letter-spacing:.06em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.95rem}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--s0);display:inline-block}
@media (max-width:640px){.top .wrap{gap:6px 12px}.tabs{order:3;flex-basis:100%}.sync{margin-left:auto;font-size:.7rem}}
.sync[data-s="cloud"] i{background:var(--s3)} .sync[data-s="saving"] i{background:var(--s2)}

main{padding-block:28px 64px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.view-head p{max-width:62ch;color:var(--muted);margin-top:6px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:600;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* bubbles (status) */
.bub{--c:var(--s0);width:14px;height:14px;border-radius:50%;border:2px solid var(--c);display:inline-block;flex:none;position:relative;background:transparent}
.bub.s1{--c:var(--s1);background:linear-gradient(to top,var(--c) 33%,transparent 33%)}
.bub.s2{--c:var(--s2);background:linear-gradient(to top,var(--c) 60%,transparent 60%)}
.bub.s3{--c:var(--s3);background:var(--c)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* dashboard */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:14px 0 10px}
.stack span{display:block;height:100%}
.bignum{font-family:var(--f-display);font-size:3rem;line-height:1;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border-top:3px solid var(--c,var(--s0));padding-top:8px}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.next-card{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.topics-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:12px}
.tmini{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px}
.tmini:hover{border-color:var(--muted)}
.tmini .row{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.tmini .row b{font-weight:600}
.minibar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.minibar span{height:100%}

/* vocab setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.topic-group{margin-bottom:14px}
.topic-group .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.86rem;text-align:left}
.tchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.tchip small{font-family:var(--f-mono);color:var(--muted);font-size:.72rem}
.sticky-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:14px}
.qline{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.qline:last-child{border-bottom:0}
.field-label{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}

/* session */
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.stage{max-width:620px;margin:0 auto}
.card{display:grid;perspective:1400px;cursor:pointer;min-height:330px}
.card .face{grid-area:1/1;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card .back{transform:rotateY(180deg)}
.card.flipped .front{transform:rotateY(-180deg)}
.card.flipped .back{transform:rotateY(0)}
@media (prefers-reduced-motion:reduce){.card .face{transition:none}}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.front .word{font-family:var(--f-display);font-size:clamp(2.2rem,7vw,3.4rem);font-weight:500;margin:auto 0;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.front .pos{text-align:center;font-style:italic;font-family:var(--f-display);color:var(--muted);font-size:1.1rem;margin-top:-4px}
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:auto}
.w2{font-family:var(--f-display);font-size:1.25rem;font-style:italic;color:var(--muted)}
.arti{font-family:var(--f-display);font-size:clamp(1.8rem,5vw,2.4rem);font-weight:600;color:var(--accent);line-height:1.15;margin:4px 0 12px}
.def{font-size:1.02rem;margin:0 0 12px}
.ex{font-family:var(--f-display);font-size:1.1rem;font-style:italic;border-left:3px solid var(--line);padding-left:12px;margin:0}
.ex mark{background:transparent;color:var(--ink);font-weight:600;font-style:normal;border-bottom:2px solid var(--accent)}
.ai-box{margin-top:14px;font-size:.92rem}
.ai-box .ai-ex{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.ai-box .ai-ex p{margin:2px 0}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;font-size:.92rem}
.rate button .bub{width:20px;height:20px;border-width:2.5px}
.rate button kbd{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-weight:400}
.rate button[data-s="1"]:hover,.rate button[data-s="1"][aria-pressed="true"]{border-color:var(--s1);background:var(--s1-soft)}
.rate button[data-s="2"]:hover,.rate button[data-s="2"][aria-pressed="true"]{border-color:var(--s2);background:var(--s2-soft)}
.rate button[data-s="3"]:hover,.rate button[data-s="3"][aria-pressed="true"]{border-color:var(--s3);background:var(--s3-soft)}
.quiz-q{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px}
.quiz-q .prompt{font-family:var(--f-display);font-size:1.5rem;margin:10px 0 18px;line-height:1.3}
.quiz-q .prompt.big{font-size:clamp(2rem,6vw,2.8rem);text-align:center;font-weight:500}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .k{font-family:var(--f-mono);font-size:.75rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt.right{border-color:var(--s3);background:var(--s3-soft)} .opt.right .k{background:var(--s3);border-color:var(--s3);color:var(--surface)}
.opt.wrong{border-color:var(--s1);background:var(--s1-soft)} .opt.wrong .k{background:var(--s1);border-color:var(--s1);color:var(--surface)}
.opt:disabled{cursor:default}
.reveal{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.verdict{font-weight:700;margin-bottom:6px}
.verdict.ok{color:var(--s3)} .verdict.no{color:var(--s1)}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.summary-grid div{border-radius:10px;padding:14px;background:var(--sunk)}
.summary-grid b{font-family:var(--f-mono);font-size:1.8rem;display:block}

/* rekap list */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;max-width:100%}
.wlist{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.wrow{border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow summary{display:grid;grid-template-columns:22px minmax(0,1.1fr) minmax(0,1fr) 150px;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.wrow summary::-webkit-details-marker{display:none}
.wrow summary:hover{background:var(--sunk)}
.wrow .ww{font-family:var(--f-display);font-size:1.08rem;font-weight:500;overflow-wrap:anywhere}
.wrow .ww em{font-size:.85rem;color:var(--muted);margin-left:6px}
.wrow .wa{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.wrow .wm{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap;text-align:right;overflow:hidden;text-overflow:ellipsis}
.wrow .wd{padding:0 14px 14px 48px;font-size:.93rem}
.wrow .wd .setrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
@media (max-width:560px){.wrow summary{grid-template-columns:22px minmax(0,1fr) 92px}.wrow .wa{grid-column:2}.wrow .wm{grid-row:1;grid-column:3}.wrow .wd{padding-left:14px}}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* grammar */
.gl{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.gl{grid-template-columns:1fr}}
.gnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){.gnav{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.gnav .gg{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 10px 4px}
@media (max-width:860px){.gnav .gg{display:none}}
.gnav button{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:.9rem;color:var(--ink)}
@media (max-width:860px){.gnav button{white-space:nowrap;border:1px solid var(--line)}}
.gnav button:hover{background:var(--sunk)}
.gnav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.gnav .tick{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:.7rem;color:var(--surface)}
.gnav .tick.on{background:var(--s3);border-color:var(--s3)}
.lesson{min-width:0}
.lesson .why{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:.95rem}
.lesson .why b{color:var(--accent)}
.lesson .explain p{max-width:68ch}
.skills{display:flex;gap:6px;margin-top:8px}
.skills span{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tbl th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-family:var(--f-mono);font-weight:600}
.tbl i,.exs i{font-family:var(--f-display);font-size:1.03em}
.exs{display:grid;gap:8px;margin:8px 0}
.exs div{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.exs .en{font-family:var(--f-display);font-size:1.08rem;font-style:italic}
.exs .nt{font-size:.85rem;color:var(--muted)}
.mist{display:grid;gap:8px}
.mist div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
@media (max-width:560px){.mist div{grid-template-columns:1fr}}
.mist .x{color:var(--s1);text-decoration:line-through;text-decoration-thickness:1px}
.mist .v{color:var(--s3);font-weight:600}
.mist .y{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.gquiz{display:grid;gap:14px}
.gq{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.gq .q{font-weight:600;margin-bottom:8px}
.gq .opts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gq .opt{padding:8px 12px;font-size:.93rem}
.gq .why2{font-size:.86rem;margin-top:8px}
.practice{border:1.5px dashed var(--line);border-radius:12px;padding:16px;margin-top:18px}
.practice textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);resize:vertical;margin:8px 0}
.ai-out{white-space:pre-wrap;font-size:.94rem;background:var(--sunk);border-radius:9px;padding:12px 14px;margin-top:10px}
.lesson-foot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}

/* guide */
.subnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:22px}
.subnav button{border:0;background:transparent;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.subnav button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.guide{max-width:860px}
.guide .lead{font-size:1.06rem;max-width:70ch}
.guide p,.guide li{max-width:72ch}
.note{font-size:.86rem;color:var(--muted)}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 8px}
@media (max-width:640px){.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tl{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tl-k{font-family:var(--f-mono);font-weight:600;color:var(--accent-ink);background:var(--accent);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;flex:none}
.tl b{display:block} .tl span{font-size:.82rem;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.parts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.parts,.parts.two{grid-template-columns:1fr}}
.part{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.part-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.part-h span{font-family:var(--f-display);font-size:1.25rem;font-weight:600;color:var(--accent)}
.part-h em{font-family:var(--f-mono);font-style:normal;font-size:.72rem;color:var(--muted)}
.part p{font-size:.92rem}
.struct{display:grid;grid-template-columns:22px 1fr;gap:6px 8px;font-size:.88rem;margin:10px 0;align-items:center}
.struct span{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.ticks{padding-left:1.1rem} .ticks li{margin:4px 0}
.steps li{margin:6px 0}
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
@media (max-width:720px){.compare{grid-template-columns:1fr}}
.compare div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.9rem}
.compare .tag{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.criteria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
@media (max-width:560px){.criteria{grid-template-columns:1fr}}
.criteria div{border-top:3px solid var(--accent);background:var(--surface);border-radius:0 0 10px 10px;padding:10px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.criteria b{display:block;margin-bottom:2px} .criteria span{font-size:.88rem;color:var(--muted)}
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.calc label{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);gap:4px;font-weight:600}
.calc .out{margin-left:auto;text-align:right}
.calc .out b{font-family:var(--f-display);font-size:2.2rem;display:block;line-height:1;color:var(--accent)}
.scale{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.scale div{flex:1;min-width:52px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.scale b{font-family:var(--f-display);font-size:1.15rem;display:block;color:var(--accent)}
.scale span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.qtypes{display:grid;gap:10px}
.qt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.qt-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qt-h b{font-size:1.02rem}
.qt-h small{color:var(--muted)}
.qt ul{margin:8px 0;padding-left:1.1rem;font-size:.92rem}
.refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ref{font-family:var(--f-mono);font-size:.7rem;background:var(--sunk);border-radius:4px;padding:2px 7px;color:var(--muted)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.book-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.book-h b{font-family:var(--f-display);font-size:1.15rem}
.book section{padding:10px 16px;border-bottom:1px solid var(--line)}
.book section:last-child{border-bottom:0}
.book .sk{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.book .it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:.88rem;padding:3px 0}
.book .it .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding-top:2px}
.book .it .qs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.book .it .q{font-family:var(--f-mono);font-size:.66rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.book .it .q.hl{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.book .it.dim{opacity:.35}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:.9rem;z-index:20;box-shadow:var(--shadow)}
</style>

</script>
<script>
(function(){
"use strict";
/* ---------- data ---------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const TOPICS = [
  ...VOCAB_GENERAL.map(t=>Object.assign({kind:"umum"},t)),
  ...VOCAB_TOPIC.map(t=>Object.assign({kind:"topik"},t))
];
const WORDS = [], WBY = {};
TOPICS.forEach(t=>{ t.ids=[]; t.words.forEach(([w,pos,ar,def,ex])=>{
  const o={id:t.id+"-"+slug(w), w, pos, ar, def, ex, topic:t.id};
  WORDS.push(o); WBY[o.id]=o; t.ids.push(o.id);
});});
const TBY = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const POS = {n:"noun",v:"verb",adj:"adjective",adv:"adverb",phr:"phrase",conj:"conjunction",prep:"preposition"};
const SLABEL = {0:"Belum dipelajari",1:"Ga hafal",2:"Kurang hafal",3:"Hafal banget"};
const GBY = Object.fromEntries(GRAMMAR.map(g=>[g.id,g]));

/* ---------- state ---------- */
const KEY="ielts-ruang-belajar-v1";
const blank = () => ({v:1, updated:0, session:0, words:{}, grammar:{}, days:{}, settings:{size:20, mode:"flash", topics:null}});
let S = blank();
function merge(x){ const b=blank(); if(!x||typeof x!=="object") return b;
  return Object.assign(b, x, {settings:Object.assign(b.settings, x.settings||{}), words:x.words||{}, grammar:x.grammar||{}, days:x.days||{}}); }
const st = id => S.words[id] || null;
const status = id => (S.words[id] && S.words[id].s) || 0;
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function rate(id, s){
  const o = Object.assign({s:0,d:0,h:0,w:0,c:0}, S.words[id]||{});
  o.s=s; o.c=(o.c||0)+1; o.t=Date.now();
  if(s===1){ o.w=(o.w||0)+1; o.h=0; o.d=S.session+1; }
  else if(s===2){ o.h=0; o.d=S.session+1; }
  else { o.h=(o.h||0)+1; o.d=S.session+[0,2,4,8,16][Math.min(o.h,4)]; }
  S.words[id]=o; S.days[today()]=(S.days[today()]||0)+1; touch();
}
function setStatusOnly(id,s){
  if(s===0){ delete S.words[id]; touch(); return; }
  const o = Object.assign({s:0,d:0,h:0,w:0,c:0}, S.words[id]||{});
  o.s=s; o.t=Date.now();
  o.d = s===3 ? S.session+2 : S.session+1; if(s!==3) o.h=0; else o.h=Math.max(1,o.h||0);
  S.words[id]=o; touch();
}

/* ---------- persistence (localStorage + Firebase) ---------- */
let FS=null, UID=null, saving=false, pending=false, saveT=null, cloudState="local", unsub=null;
const syncEl = () => document.getElementById("sync");
function setSync(k){ cloudState=k; const el=syncEl(); if(!el) return; el.dataset.s=k;
  el.lastElementChild.textContent = k==="cloud" ? "Tersinkron ke akun Google" : k==="saving" ? "Menyimpan…" : "Tersimpan di browser ini"; }
function touch(){ S.updated=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(FS&&UID){ clearTimeout(saveT); saveT=setTimeout(flush, 1200); } }
async function flush(){
  if(!FS||!UID) return;
  if(saving){ pending=true; return; }
  saving=true; setSync("saving");
  try{ await FS.collection("users").doc(UID).set({state: JSON.stringify(S), updated:S.updated}); setSync("cloud"); }
  catch(e){ console.error(e); setSync("local"); toast("Gagal menyimpan ke cloud. Progres tetap aman di browser ini."); }
  saving=false; if(pending){ pending=false; flush(); }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden" && FS && UID){ clearTimeout(saveT); flush(); } });

function paintAuth(user){
  const box=document.getElementById("authbox"); if(!box) return;
  if(!FS){ box.innerHTML=""; return; }
  if(user){ box.innerHTML=`<span class="who" title="${esc(user.email||"")}">${esc((user.displayName||user.email||"Akun").split(" ")[0])}</span><button class="btn ghost sm" id="logout">Keluar</button>`;
    document.getElementById("logout").onclick=()=>{ if(confirm("Keluar dari akun? Progres tetap tersimpan di akunmu.")) firebase.auth().signOut(); }; }
  else { box.innerHTML=`<button class="btn primary sm" id="login">Masuk dengan Google</button>`;
    document.getElementById("login").onclick=login; }
}
async function login(){
  const prov=new firebase.auth.GoogleAuthProvider();
  try{ await firebase.auth().signInWithPopup(prov); }
  catch(e){
    if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) firebase.auth().signInWithRedirect(prov);
    else if(e && e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request"){ console.error(e); toast("Gagal masuk: "+(e.code||"coba lagi")); }
  }
}
function applyRemote(body){
  let remote=null; try{ remote = body && body.state ? JSON.parse(body.state) : null; }catch(e){}
  if(!remote) return false;
  if((remote.updated||0) > (S.updated||0)){
    const inSession = !!SESS;
    S=merge(remote); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(!inSession) render();
  }
  return true;
}
function initStore(){
  try{ const raw=localStorage.getItem(KEY); if(raw) S=merge(JSON.parse(raw)); }catch(e){}
  const cfg=window.FIREBASE_CONFIG;
  if(!(window.firebase && cfg && cfg.apiKey && !/^ISI_/.test(cfg.apiKey))){ setSync("local"); return; }
  try{ firebase.initializeApp(cfg); FS=firebase.firestore(); }catch(e){ console.error(e); FS=null; return; }
  firebase.auth().getRedirectResult().catch(()=>{});
  firebase.auth().onAuthStateChanged(async user=>{
    if(unsub){ unsub(); unsub=null; }
    paintAuth(user);
    if(!user){ UID=null; setSync("local"); return; }
    UID=user.uid;
    const ref=FS.collection("users").doc(UID);
    try{
      const snap=await ref.get();
      const had = snap.exists && applyRemote(snap.data());
      const ru = had ? (JSON.parse(snap.data().state).updated||0) : 0;
      if((S.updated||0) > ru) await flush(); else setSync("cloud");
    }catch(e){ console.error(e); setSync("local"); toast("Tidak bisa membaca progres dari cloud."); return; }
    // live updates from other devices
    unsub = ref.onSnapshot(s=>{ if(!s.metadata.hasPendingWrites && s.exists && !saving) applyRemote(s.data()); }, ()=>{});
  });
}


/* ---------- Claude (sample) ---------- */
let SAMPLE=null, aiOff=false;
const aiReady = Promise.resolve(null); // fitur AI Claude hanya jalan di claude.ai
function aiErr(e){
  const c = e && e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ aiOff=true; return "Fitur Claude tidak aktif di tampilan ini."; }
  if(c==="rate_limited") return "Terlalu banyak permintaan. Coba lagi beberapa saat lagi.";
  if(c==="cancelled") return "";
  if(c==="session_expired") return "Sesi login habis. Muat ulang halaman lalu coba lagi.";
  return "Claude tidak bisa menjawab sekarang. Coba lagi.";
}

/* ---------- utils ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const bub = s => `<span class="bub s${s}" aria-hidden="true"></span>`;
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function counts(ids){ const c={0:0,1:0,2:0,3:0}; ids.forEach(id=>c[status(id)]++); return c; }
function stackBar(c, total, cls="stack"){ const seg=(n,v)=>n?`<span style="width:${(n/total*100).toFixed(2)}%;background:var(--${v})"></span>`:""; return `<div class="${cls}">${seg(c[3],"s3")}${seg(c[2],"s2")}${seg(c[1],"s1")}</div>`; }
function findInEx(w){ // returns [start,end] of word in example or null
  const ex=w.ex, lw=w.w.toLowerCase(), le=ex.toLowerCase();
  let i=le.indexOf(lw); if(i>=0) return [i,i+lw.length];
  if(!/\s/.test(lw) && lw.length>=4){ let stem=lw.replace(/(e|y)$/,""); if(stem.length<4) stem=lw;
    const m = new RegExp("\\b"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[a-z]*","i").exec(ex); if(m) return [m.index, m.index+m[0].length]; }
  return null;
}
function exHTML(w){ const r=findInEx(w); if(!r) return esc(w.ex); return esc(w.ex.slice(0,r[0]))+"<mark>"+esc(w.ex.slice(r[0],r[1]))+"</mark>"+esc(w.ex.slice(r[1])); }

/* ---------- routing ---------- */
const ROUTES=["beranda","vocab","grammar","panduan"];
let route="beranda";
let VSUB="belajar"; // belajar | rekap
let SESS=null;
let GSEL=GRAMMAR[0].id;
let PSUB="overview";
function go(r){ if(location.hash!=="#"+r) location.hash=r; else render(); }
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
function render(){
  const h=(location.hash||"").slice(1); route = ROUTES.includes(h)?h:"beranda";
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.r===route?"page":"false"));
  const v=$("#view");
  if(route==="beranda") v.innerHTML=viewHome();
  else if(route==="vocab") v.innerHTML = SESS ? viewSession() : (VSUB==="rekap"? viewRekap() : viewSetup());
  else if(route==="grammar") v.innerHTML=viewGrammar();
  else v.innerHTML=viewGuide();
  after();
}

/* ---------- HOME ---------- */
function viewHome(){
  const all=WORDS.map(w=>w.id), c=counts(all), total=all.length;
  const due = WORDS.filter(w=>{const o=st(w.id); return o && o.s>0 && o.d<=S.session+1;});
  const dueWeak = due.filter(w=>status(w.id)<3).length;
  const gDone = GRAMMAR.filter(g=>S.grammar[g.id]&&S.grammar[g.id].done).length;
  const studied = Object.keys(S.days).length;
  const weakest = WORDS.filter(w=>status(w.id)===1).sort((a,b)=>(st(b.id).w||0)-(st(a.id).w||0)).slice(0,6);
  const tm = t => { const cc=counts(t.ids), n=t.ids.length; return `<button class="tmini" data-act="topic" data-t="${t.id}"><div class="row"><b>${esc(t.nameId)}</b><span class="mono muted">${cc[3]}/${n}</span></div>${stackBar(cc,n,"minibar")}</button>`; };
  return `
  <div class="view-head"><div><div class="eyebrow">Ruang belajar · Academic</div><h2>${S.updated? "Lanjutkan belajarmu" : "Mulai dari kosakata"}</h2>
  <p>${total} kata dari buku <i>Check Your Vocabulary for IELTS</i>, ${GRAMMAR.length} materi grammar, dan panduan tiap bagian tes, dipetakan ke Cambridge 16 &amp; 17.</p></div></div>
  <div class="hero">
    <div class="panel">
      <div class="eyebrow">Penguasaan kosakata</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px"><span class="bignum">${c[3]}</span><span class="muted">dari ${total} kata hafal banget</span></div>
      ${stackBar(c,total)}
      <div class="kpis">
        <div class="kpi" style="--c:var(--s3)"><b>${c[3]}</b><span>Hafal banget</span></div>
        <div class="kpi" style="--c:var(--s2)"><b>${c[2]}</b><span>Kurang hafal</span></div>
        <div class="kpi" style="--c:var(--s1)"><b>${c[1]}</b><span>Ga hafal</span></div>
        <div class="kpi"><b>${c[0]}</b><span>Belum dipelajari</span></div>
      </div>
    </div>
    <div class="panel next-card">
      <div><div class="eyebrow">Sesi berikutnya (#${S.session+1})</div>
      <p style="font-size:1.05rem;margin-top:8px">${dueWeak? `<b>${dueWeak} kata</b> yang belum hafal akan muncul lagi duluan.` : (S.updated? "Tidak ada kata lemah yang tertunda. Sesi berikutnya diisi kata baru dan ulangan." : "Belum ada riwayat. Sesi pertama berisi kata-kata baru.")}</p>
      <p class="muted" style="font-size:.88rem">${studied? `Kamu sudah belajar di ${studied} hari berbeda · grammar dipahami ${gDone}/${GRAMMAR.length}` : `Grammar dipahami ${gDone}/${GRAMMAR.length}`}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="quickstart">Mulai sesi vocab</button><a class="btn" href="#panduan">Kenali format IELTS</a></div>
    </div>
  </div>
  ${weakest.length? `<h3>Paling sering lupa</h3><div class="chips">${weakest.map(w=>`<span class="chip" style="display:inline-flex;gap:6px;align-items:center">${bub(1)}<b style="color:var(--ink)">${esc(w.w)}</b> ${esc(w.ar)}</span>`).join("")}</div>`:""}
  <h3>Topik umum (hlm. 1–48)</h3><div class="topics-mini">${TOPICS.filter(t=>t.kind==="umum").map(tm).join("")}</div>
  <h3>Topik IELTS (hlm. 49–95)</h3><div class="topics-mini">${TOPICS.filter(t=>t.kind==="topik").map(tm).join("")}</div>
  <div class="legend" style="margin-top:14px"><span>${bub(3)} hafal banget</span><span>${bub(2)} kurang hafal</span><span>${bub(1)} ga hafal</span><span>${bub(0)} belum</span></div>`;
}

/* ---------- VOCAB SETUP ---------- */
function selTopics(){ return S.settings.topics && S.settings.topics.length ? S.settings.topics.filter(id=>TBY[id]) : TOPICS.map(t=>t.id); }
function buildQueue(topicIds, size, nextSession){
  const pool = WORDS.filter(w=>topicIds.includes(w.topic));
  const due = pool.filter(w=>{const o=st(w.id); return o && o.s>0 && o.d<=nextSession;})
    .sort((a,b)=>status(a.id)-status(b.id) || (st(b.id).w||0)-(st(a.id).w||0));
  const fresh = pool.filter(w=>status(w.id)===0);
  const q = due.slice(0,size).map(w=>w.id);
  const nDue=q.length;
  for(const w of fresh){ if(q.length>=size) break; q.push(w.id); }
  return {q, nDue, nNew:q.length-nDue, nWeak: q.slice(0,nDue).filter(id=>status(id)<3).length};
}
function viewSetup(){
  const sel=selTopics(), size=S.settings.size, mode=S.settings.mode;
  const plan=buildQueue(sel,size,S.session+1);
  const tc = t => { const c=counts(t.ids); return `<button class="tchip" data-act="tt" data-t="${t.id}" aria-pressed="${sel.includes(t.id)}">${esc(t.nameId)} <small>${c[3]}/${t.ids.length}</small></button>`; };
  const grp=(kind,label)=>{ const ts=TOPICS.filter(t=>t.kind===kind); const allOn=ts.every(t=>sel.includes(t.id));
    return `<div class="topic-group"><div class="gh"><span class="field-label" style="margin:0">${label}</span><button class="btn ghost sm" data-act="tgroup" data-k="${kind}">${allOn?"Kosongkan":"Pilih semua"}</button></div><div class="chips">${ts.map(tc).join("")}</div></div>`; };
  const seg=(key,val,label)=>`<button data-act="set" data-k="${key}" data-v="${val}" aria-pressed="${String(S.settings[key])===String(val)}">${label}</button>`;
  return `
  <div class="view-head"><div><div class="eyebrow">Vocab</div><h2>Atur sesi belajar</h2><p>Kata yang kamu tandai <b>ga hafal</b> atau <b>kurang hafal</b> otomatis muncul lagi di sesi berikutnya. Kata yang <b>hafal banget</b> diulang dengan jarak yang makin panjang.</p></div>
  <div class="seg">${["belajar","rekap"].map(k=>`<button data-act="vsub" data-v="${k}" aria-pressed="${VSUB===k}">${k==="belajar"?"Belajar":"Rekap kata"}</button>`).join("")}</div></div>
  <div class="setup">
    <div class="panel">${grp("umum","Topik umum · hlm. 1–48")}${grp("topik","Topik IELTS · hlm. 49–95")}</div>
    <div class="sticky-side">
      <div class="panel">
        <span class="field-label">Mode</span>
        <div class="seg" style="margin-bottom:14px">${seg("mode","flash","Flashcard")}${seg("mode","quiz","Kuis")}${seg("mode","mix","Campuran")}</div>
        <span class="field-label">Jumlah kata per sesi</span>
        <div class="seg" style="margin-bottom:16px">${[10,20,30].map(n=>seg("size",n,n)).join("")}</div>
        <span class="field-label">Isi sesi #${S.session+1}</span>
        <div class="qline"><span>${bub(1)} Ulang (belum hafal)</span><b class="mono">${plan.nWeak}</b></div>
        <div class="qline"><span>${bub(3)} Ulang (hafal, jadwal tiba)</span><b class="mono">${plan.nDue-plan.nWeak}</b></div>
        <div class="qline"><span>${bub(0)} Kata baru</span><b class="mono">${plan.nNew}</b></div>
        <button class="btn primary" style="width:100%;margin-top:14px" data-act="start" ${plan.q.length?"":"disabled"}>Mulai ${plan.q.length} kartu</button>
        ${plan.q.length?"":`<p class="note" style="margin-top:8px">Semua kata di topik ini sudah hafal dan belum jadwalnya diulang. Pilih topik lain atau latih lewat Rekap.</p>`}
      </div>
      <p class="note">Pintasan: <span class="mono">Spasi</span> balik kartu · <span class="mono">1 2 3</span> pilih status · <span class="mono">A–D</span> jawab kuis · <span class="mono">Enter</span> lanjut</p>
    </div>
  </div>`;
}

/* ---------- SESSION ---------- */
function startSession(ids, mode, label){
  if(!ids.length) return;
  S.session++; touch();
  SESS={q:ids.slice(), i:0, mode, res:{}, requeued:new Set(), card:null, label:label||""};
  nextCard(); go("vocab");
}
function pickType(w){
  const m=SESS.mode;
  let t = m==="flash" ? "flash" : m==="quiz" ? ["mean","word","gap"][Math.floor(Math.random()*3)] : ["flash","mean","word","gap"][Math.floor(Math.random()*4)];
  if(t==="gap" && !findInEx(w)) t="word";
  return t;
}
function distractors(w, field){
  // meanings: same-topic distractors are harder; words: other topics + same part of speech, so no synonym fits
  const others = WORDS.filter(x=>x.topic!==w.topic);
  const pool = field==="ar"
    ? shuffle(WORDS.filter(x=>x.topic===w.topic && x.id!==w.id)).concat(shuffle(others))
    : shuffle(others.filter(x=>x.pos===w.pos)).concat(shuffle(others));
  const out=[], seen=new Set([w[field].toLowerCase()]);
  for(const x of pool){ const v=x[field].toLowerCase(); if(seen.has(v)) continue; seen.add(v); out.push(x); if(out.length===3) break; }
  return out;
}
function nextCard(){
  if(SESS.i>=SESS.q.length){ SESS.card={type:"end"}; return; }
  const w=WBY[SESS.q[SESS.i]], type=pickType(w);
  const card={type, id:w.id, flipped:false, answered:null, sel:null, ai:null};
  if(type!=="flash"){ const field = type==="mean"?"ar":"w"; card.field=field;
    const opts=shuffle([w].concat(distractors(w,field))); card.opts=opts.map(o=>o.id); card.correct=card.opts.indexOf(w.id); }
  SESS.card=card;
}
function commitRate(s){
  const c=SESS.card; if(!c||c.type==="end") return;
  rate(c.id,s); SESS.res[c.id]=s;
  if(s===1 && !SESS.requeued.has(c.id)){ SESS.requeued.add(c.id); const pos=Math.min(SESS.q.length, SESS.i+5); SESS.q.splice(pos,0,c.id); }
  SESS.i++; nextCard(); render();
}
function viewSession(){
  const c=SESS.card, n=SESS.q.length, done=Math.min(SESS.i,n);
  const top = `<div class="sess-top"><button class="btn ghost sm" data-act="quit">← Keluar</button><div class="progress"><span style="width:${(done/n*100).toFixed(1)}%"></span></div><span class="mono muted" style="font-size:.85rem">${done}/${n}</span></div>`;
  if(c.type==="end") return top+viewEnd();
  const w=WBY[c.id], t=TBY[w.topic], prev=status(w.id);
  const meta=`<div class="meta"><span>${esc(t.nameId)} · hlm. ${t.page}</span><span style="display:inline-flex;gap:6px;align-items:center">${bub(prev)}${SLABEL[prev]}</span></div>`;
  const back = `<div class="w2">${esc(w.w)} <span style="font-size:.9rem">(${POS[w.pos]||w.pos})</span></div>
      <div class="arti">${esc(w.ar)}</div>
      <p class="def">${esc(w.def)}</p>
      <p class="ex">${exHTML(w)}</p>
      <div class="ai-box" id="aibox">${aiBoxHTML(c)}</div>`;
  const rateRow = sel => `<div class="rate" role="group" aria-label="Seberapa hafal?">${[1,2,3].map(s=>`<button data-act="rate" data-s="${s}" aria-pressed="${sel===s}">${bub(s)}${SLABEL[s]}<kbd>${s}</kbd></button>`).join("")}</div>`;
  if(c.type==="flash"){
    return top+`<div class="stage">
      <div class="card ${c.flipped?"flipped":""}" data-act="flip" role="button" tabindex="0" aria-label="Balik kartu">
        <div class="face front">${meta}<div class="word">${esc(w.w)}</div><div class="pos">${POS[w.pos]||w.pos}</div><div class="hint">Ingat artinya, lalu ketuk kartu atau tekan Spasi</div></div>
        <div class="face back">${meta}${back}</div>
      </div>
      ${c.flipped? rateRow(null) : `<div class="nextbar"><span class="note">Tandai statusnya setelah kartu dibalik.</span><button class="btn" data-act="flip">Balik kartu</button></div>`}
    </div>`;
  }
  // quiz
  let prompt, label;
  if(c.type==="mean"){ label="Apa arti kata ini?"; prompt=`<div class="prompt big">${esc(w.w)}</div><div class="pos" style="text-align:center;font-family:var(--f-display);font-style:italic;color:var(--muted);margin:-10px 0 16px">${POS[w.pos]||w.pos}</div>`; }
  else if(c.type==="word"){ label="Kata mana yang sesuai definisi ini?"; prompt=`<div class="prompt">${esc(w.def)}</div>`; }
  else { label="Lengkapi kalimatnya"; const r=findInEx(w); prompt=`<div class="prompt">${esc(w.ex.slice(0,r[0]))}<span style="border-bottom:2px solid var(--accent);display:inline-block;min-width:5ch">&nbsp;</span>${esc(w.ex.slice(r[1]))}</div>`; }
  const opts = c.opts.map((id,i)=>{ const o=WBY[id]; let cls=""; if(c.answered!==null){ if(i===c.correct) cls="right"; else if(i===c.answered) cls="wrong"; }
    return `<button class="opt ${cls}" data-act="ans" data-i="${i}" ${c.answered!==null?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o[c.field])}</span></button>`; }).join("");
  let rev="";
  if(c.answered!==null){ const ok=c.answered===c.correct;
    rev=`<div class="reveal"><div class="verdict ${ok?"ok":"no"}">${ok?"Benar.":"Belum tepat."}</div>${back}
      <p class="note" style="margin-top:12px">Status yang disarankan sudah dipilih. Ganti kalau perlu, lalu lanjut.</p>${rateRow(c.sel)}
      <div class="nextbar"><span></span><button class="btn primary" data-act="next">Lanjut ↵</button></div></div>`; }
  return top+`<div class="stage"><div class="quiz-q">${meta}<div class="eyebrow" style="margin-top:14px">${label}</div>${prompt}<div class="opts">${opts}</div>${rev}</div></div>`;
}
function aiBoxHTML(c){
  if(aiOff || !SAMPLE) return "";
  if(!c.ai) return `<button class="btn ghost sm" data-act="aiex">✦ Minta contoh kalimat lain dari Claude</button>`;
  if(c.ai.loading) return `<span class="note">Claude sedang menulis contoh…</span>`;
  if(c.ai.err) return `<span class="note">${esc(c.ai.err)}</span> <button class="btn ghost sm" data-act="aiex">Coba lagi</button>`;
  return c.ai.items.map(x=>`<div class="ai-ex"><p class="ex" style="border:0;padding:0">${esc(x.en)}</p><p class="note">${esc(x.id)}</p></div>`).join("")+`<button class="btn ghost sm" data-act="aiex" style="margin-top:6px">Contoh lain</button>`;
}
async function aiExample(){
  const c=SESS&&SESS.card; if(!c||!SAMPLE) return; const w=WBY[c.id]; const cardRef=c;
  c.ai={loading:true}; paintAI();
  const prompt=`You help an Indonesian student prepare for IELTS Academic. Target vocabulary: "${w.w}" (${POS[w.pos]||w.pos}), meaning: "${w.def}".
Write 2 new, natural example sentences using "${w.w}" correctly: one in a formal style suitable for IELTS Writing Task 2, one in a conversational style suitable for IELTS Speaking. Keep each under 25 words. Do not reuse this sentence: "${w.ex}".
Give an Indonesian translation for each.
Reply with only a JSON array like [{"en":"...","id":"..."},{"en":"...","id":"..."}].`;
  try{ const arr = await SAMPLE.json(prompt,{modelTier:"quick", cache:false});
    const items = Array.isArray(arr)? arr.filter(x=>x&&x.en).slice(0,3).map(x=>({en:String(x.en), id:String(x.id||"")})) : [];
    cardRef.ai = items.length? {items} : {err:"Jawaban Claude tidak terbaca. Coba lagi."};
  }catch(e){ const m=aiErr(e); cardRef.ai = m? {err:m} : null; }
  if(SESS && SESS.card===cardRef) paintAI();
}
function paintAI(){ const el=$("#aibox"); if(el && SESS && SESS.card) el.innerHTML=aiBoxHTML(SESS.card); }
function viewEnd(){
  const ids=Object.keys(SESS.res), c={1:0,2:0,3:0}; ids.forEach(id=>c[SESS.res[id]]++);
  const weak=ids.filter(id=>SESS.res[id]<3);
  return `<div class="stage"><div class="panel">
    <div class="eyebrow">Sesi #${S.session} selesai</div><h2 style="margin-top:6px">${weak.length? `${weak.length} kata masih perlu diulang` : "Semua kata di sesi ini hafal banget"}</h2>
    <div class="summary-grid"><div><b style="color:var(--s3)">${c[3]}</b>Hafal banget</div><div><b style="color:var(--s2)">${c[2]}</b>Kurang hafal</div><div><b style="color:var(--s1)">${c[1]}</b>Ga hafal</div></div>
    ${weak.length? `<p class="muted">Kata-kata ini otomatis masuk sesi berikutnya:</p><div class="chips" style="margin:8px 0 16px">${weak.map(id=>`<span class="chip" style="display:inline-flex;gap:6px;align-items:center">${bub(SESS.res[id])}<b style="color:var(--ink)">${esc(WBY[id].w)}</b> ${esc(WBY[id].ar)}</span>`).join("")}</div>`:""}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${weak.length?`<button class="btn primary" data-act="againweak">Ulangi ${weak.length} kata ini sekarang</button>`:""}<button class="btn" data-act="newsess">Sesi baru</button><button class="btn ghost" data-act="quit">Kembali</button></div>
  </div></div>`;
}

/* ---------- REKAP ---------- */
let RF={s:"all", q:"", t:"all"};
function rekapList(){
  const q=RF.q.trim().toLowerCase();
  return WORDS.filter(w=> (RF.t==="all"||w.topic===RF.t) && (RF.s==="all"||String(status(w.id))===RF.s) && (!q || w.w.toLowerCase().includes(q) || w.ar.toLowerCase().includes(q)));
}
function viewRekap(){
  const all=counts(WORDS.map(w=>w.id));
  const fchip=(v,l,n)=>`<button class="chip" data-act="rf" data-k="s" data-v="${v}" aria-pressed="${RF.s===v}">${l} <span class="mono">${n}</span></button>`;
  return `
  <div class="view-head"><div><div class="eyebrow">Vocab</div><h2>Rekap kata</h2><p>Semua kata beserta statusnya. Ketuk sebuah kata untuk melihat definisi dan contoh, atau ubah statusnya langsung.</p></div>
  <div class="seg">${["belajar","rekap"].map(k=>`<button data-act="vsub" data-v="${k}" aria-pressed="${VSUB===k}">${k==="belajar"?"Belajar":"Rekap kata"}</button>`).join("")}</div></div>
  <div class="toolbar"><div class="chips">${fchip("all","Semua",WORDS.length)}${fchip("1","Ga hafal",all[1])}${fchip("2","Kurang hafal",all[2])}${fchip("3","Hafal banget",all[3])}${fchip("0","Belum",all[0])}</div></div>

function rekapRows(){
  const L=rekapList();

  return `<p class="note" style="margin:0 0 8px">${L.length} kata</p><div class="wlist">${L.map(w=>{ const o=st(w.id), s=status(w.id);
    return `<details class="wrow" data-id="${w.id}"><summary>${bub(s)}<span class="ww">${esc(w.w)}<em>${w.pos}</em></span><span class="wa">${esc(w.ar)}</span><span class="wm">${o&&o.w?`lupa ${o.w}×`:esc(TBY[w.topic].nameId)}</span></summary>
    <div class="wd"><p class="def" style="margin:0 0 6px">${esc(w.def)}</p><p class="ex">${exHTML(w)}</p>
    <div class="setrow">${[1,2,3].map(k=>`<button class="chip" data-act="setst" data-id="${w.id}" data-s="${k}" aria-pressed="${s===k}" style="display:inline-flex;gap:6px;align-items:center">${bub(k)}${SLABEL[k]}</button>`).join("")}${s?`<button class="chip" data-act="setst" data-id="${w.id}" data-s="0">Reset</button>`:""}</div></div></details>`; }).join("")}</div>`;
}

/* ---------- GRAMMAR ---------- */
let GQ={}; // answers per lesson in memory: {lessonId:{qi:answer}}
let GAI={}; // ai output per lesson
let GTXT={}; // draft text per lesson
document.addEventListener("input", e=>{ const t=e.target; if(t.id && t.id.startsWith("gtext-")) GTXT[t.id.slice(6)]=t.value; });
function viewGrammar(){
  const g=GBY[GSEL], gs=S.grammar[g.id]||{};

      return `<button class="opt ${cls}" data-act="gans" data-q="${qi}" data-o="${oi}" ${a!==undefined?"disabled":""}><span class="k">${"ABCD"[oi]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
      ${a!==undefined?`<div class="why2 ${a===q.a?"":""}"><b style="color:var(--${a===q.a?"s3":"s1"})">${a===q.a?"Benar.":"Belum tepat."}</b> ${esc(q.why)}</div>`:""}</div>`; }).join("");

  return `
  <div class="view-head"><div><div class="eyebrow">Grammar</div><h2>Materi grammar untuk IELTS</h2><p>Setiap materi berisi penjelasan, pola, contoh, kesalahan umum, dan latihan singkat. Tandai "Sudah paham" untuk melacak progresmu.</p></div>

    <h3>Contoh dalam konteks IELTS</h3><div class="exs">${g.examples.map(e=>`<div><div class="en">${esc(e.en)}</div><div class="nt">${esc(e.note)}</div></div>`).join("")}</div>
    <h3>Kesalahan yang sering terjadi</h3><div class="mist">${g.mistakes.map(m=>`<div><span class="x">${esc(m.wrong)}</span><span class="v">${esc(m.right)}</span><span class="y">${esc(m.why)}</span></div>`).join("")}</div>
    <h3>Latihan cepat ${nAns?`<span class="mono muted" style="font-size:.85rem;font-family:var(--f-mono)">· ${nOk}/${g.quiz.length} benar</span>`:""}</h3>
    <div class="gquiz">${quiz}</div>
    ${nAns===g.quiz.length?`<button class="btn ghost sm" data-act="greset" style="margin-top:8px">Ulangi latihan</button>`:""}
    <div class="practice">
      <b>Coba tulis sendiri</b><p class="muted" style="font-size:.92rem">${esc(g.practice)}</p>
      <textarea id="gtext-${g.id}" placeholder="Tulis kalimatmu di sini…">${esc(GTXT[g.id]||"")}</textarea>

    </div>
  </article></div>`;
}
function gAiHTML(g){
  const ai=GAI[g.id];
  if(aiOff || !SAMPLE) return `<p class="note">Bandingkan tulisanmu dengan pola dan contoh di atas.</p>`;
  let out="";
  if(ai && (ai.out||ai.loading||ai.err)) out=`<div class="ai-out" id="gaiout">${ai.out?esc(ai.out):(ai.loading?"Claude sedang membaca kalimatmu…":"")}${ai.err?`<span class="note">${esc(ai.err)}</span>`:""}</div>`;
  return `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-act="gcheck" ${ai&&ai.loading?"disabled":""}>✦ Cek dengan Claude</button>${ai&&ai.loading?`<button class="btn sm" data-act="gstop">Stop</button>`:""}</div>${out}`;
}
async function gCheck(){
  const g=GBY[GSEL], ta=$("#gtext-"+g.id), text=(ta&&ta.value||"").trim();
  if(!text){ toast("Tulis kalimatmu dulu."); return; }
  if(!SAMPLE) return;
  const ctl=new AbortController(); GAI[g.id]={text, loading:true, out:"", ctl}; paintG();
  const prompt=`Kamu adalah tutor IELTS yang ramah untuk pelajar Indonesia. Materi grammar yang sedang dipelajari: "${g.title}".
Tugas latihan: ${g.practice}
Tulisan siswa:
"""${text.slice(0,2000)}"""

Beri umpan balik dalam bahasa Indonesia yang singkat dan jelas (maksimal 170 kata), dengan format persis:
Penilaian: (apakah struktur ${g.title} dipakai dengan benar; sebut yang sudah bagus)
Perbaikan: (tulis ulang kalimat siswa yang sudah dikoreksi, dalam bahasa Inggris)
Penjelasan: (1–3 poin singkat tentang kesalahan, jika ada)
Versi band 7+: (satu versi lebih kaya dalam bahasa Inggris yang tetap memakai struktur ini)
Jangan memakai markdown seperti ** atau #.`;
  try{ const r=await SAMPLE(prompt,{signal:ctl.signal, onText:({text:t})=>{ const a=GAI[g.id]; if(a){ a.out=t; const el=$("#gaiout"); if(el && GSEL===g.id) el.textContent=t; } }});
    GAI[g.id]={text, out:r.text};
  }catch(e){ const m=aiErr(e); GAI[g.id]={text, out:(e&&e.text)||"", err:m}; }
  if(GSEL===g.id) paintG();
}
function paintG(){ const el=$("#gaiwrap"); if(el) el.innerHTML=gAiHTML(GBY[GSEL]); }

/* ---------- GUIDE ---------- */
const SCALE={L:[[39,40,9],[37,38,8.5],[35,36,8],[32,34,7.5],[30,31,7],[26,29,6.5],[23,25,6],[18,22,5.5],[16,17,5],[13,15,4.5],[10,12,4]],
             R:[[39,40,9],[37,38,8.5],[35,36,8],[33,34,7.5],[30,32,7],[27,29,6.5],[23,26,6],[19,22,5.5],[15,18,5],[13,14,4.5],[10,12,4]]};
let PQ="all";
function viewGuide(){
  const subs=[["overview","Gambaran umum"],["listening","Listening"],["reading","Reading"],["writing","Writing"],["speaking","Speaking"],["types","Tipe soal"],["books","Latihan di bukumu"]];
  let body;
  if(GUIDE[PSUB]) body=`<div class="guide"><h2>${GUIDE[PSUB].title}</h2>${GUIDE[PSUB].html}${PSUB==="listening"||PSUB==="reading"?typesFor(PSUB==="listening"?"Listening":"Reading",true):""}</div>`;
  else if(PSUB==="types") body=`<div class="guide"><h2>Tipe soal & strateginya</h2><p class="lead">Semua tipe soal Listening dan Reading Academic. Label di bawah tiap tipe menunjukkan di mana soal itu muncul di Cambridge 16 &amp; 17.</p><h3>Listening</h3>${typesFor("Listening")}<h3>Reading</h3>${typesFor("Reading")}</div>`;
  else body=viewBooks();
  return `<div class="view-head"><div><div class="eyebrow">Panduan IELTS</div></div></div>
  <div class="subnav" role="tablist">${subs.map(([k,l])=>`<button data-act="psub" data-v="${k}" aria-current="${PSUB===k}">${l}</button>`).join("")}</div>${body}`;
}
function refsFor(code){ const out=[]; PRACTICE.forEach(p=>{ ["L","R"].forEach(sk=>p[sk].forEach((it,pi)=>it[1].forEach(([c,qs])=>{ if(c===code) out.push(`${p.book.replace("Cambridge ","C")} T${p.test} ${sk==="L"?"Part":"P"}${pi+1} · Q${qs}`); }))); }); return out; }
function typesFor(sk, compact){
  const codes=Object.keys(QTYPE).filter(k=>QTYPE[k].s===sk);
  return (compact?`<h3>Tipe soal ${sk}</h3>`:"")+`<div class="qtypes">${codes.map(k=>{ const tip=QTIPS[k], refs=refsFor(k);
    return `<div class="qt"><div class="qt-h"><b>${esc(QTYPE[k].name)}</b><small>${esc(QTYPE[k].id)}</small></div><p style="font-size:.93rem">${tip[0]}</p>${compact?"":`<ul>${tip[1].map(x=>`<li>${x}</li>`).join("")}</ul>`}
    ${refs.length?`<div class="refs">${refs.slice(0,compact?6:40).map(r=>`<span class="ref">${r}</span>`).join("")}${compact&&refs.length>6?`<span class="ref">+${refs.length-6} lagi</span>`:""}</div>`:""}</div>`; }).join("")}</div>`+(compact?`<p class="note" style="margin-top:8px">Strategi lengkap tiap tipe ada di tab <b>Tipe soal</b>.</p>`:"");
}
function viewBooks(){
  const opt=Object.keys(QTYPE).map(k=>`<option value="${k}" ${PQ===k?"selected":""}>${QTYPE[k].s}: ${esc(QTYPE[k].name)}</option>`).join("");
  const item=(n,title,qs)=>{ const hit = PQ==="all" || qs.some(([c])=>c===PQ);
    return `<div class="it ${hit?"":"dim"}"><span class="n">${n}</span><div><div>${esc(title)}</div><div class="qs">${qs.map(([c,r])=>`<span class="q ${PQ===c?"hl":""}">${esc(QTYPE[c].name)} ${r}</span>`).join("")}</div></div></div>`; };
  const wOn = PQ==="all";
  return `<div class="guide" style="max-width:none"><h2>Latihan di bukumu</h2>
  <p class="lead">Peta isi Cambridge IELTS 16 &amp; 17 Academic: topik tiap bagian dan tipe soalnya. Pakai filter untuk mencari tes yang melatih tipe soal yang ingin kamu kuasai.</p>
  <div class="toolbar"><select class="sel" id="pq" aria-label="Filter tipe soal"><option value="all">Semua tipe soal</option>${opt}</select></div>
  <div class="books">${PRACTICE.map(p=>`<div class="book"><div class="book-h"><b>${p.book}</b><span class="mono muted">Test ${p.test}</span></div>
    <section><div class="sk">Listening</div>${p.L.map((it,i)=>item("P"+(i+1),it[0],it[1])).join("")}</section>
    <section><div class="sk">Reading</div>${p.R.map((it,i)=>item("RP"+(i+1),it[0],it[1])).join("")}</section>
    <section class="${wOn?"":"dim"}"><div class="sk">Writing</div>${p.W.map((it,i)=>`<div class="it ${wOn?"":"dim"}"><span class="n">T${i+1}</span><div><b style="font-weight:600">${esc(it[0])}</b> · ${esc(it[1])}</div></div>`).join("")}</section>
    <section><div class="sk">Speaking</div><div class="it ${wOn?"":"dim"}"><span class="n">P1</span><div>${esc(p.S[0])}</div></div><div class="it ${wOn?"":"dim"}"><span class="n">P2</span><div>${esc(p.S[1])}</div></div></section>
  </div>`).join("")}</div></div>`;
}
function bandCalc(){
  const el=$("#band-calc"); if(!el) return;
  const opts=[]; for(let b=9;b>=3;b-=.5) opts.push(b);
  const names=["Listening","Reading","Writing","Speaking"], def=[6.5,6.5,6,6.5];
  el.innerHTML=`<div class="eyebrow" style="width:100%">Kalkulator overall</div>`+names.map((n,i)=>`<label>${n}<select class="sel bc" id="bc${i}">${opts.map(b=>`<option ${b===def[i]?"selected":""}>${b.toFixed(1)}</option>`).join("")}</select></label>`).join("")+`<div class="out"><span class="note">Overall</span><b id="bcout">–</b><span class="note mono" id="bcavg"></span></div>`;
  const calc=()=>{ const v=[0,1,2,3].map(i=>parseFloat($("#bc"+i).value)); const avg=v.reduce((a,b)=>a+b,0)/4;
    const ov=Math.floor(avg)+ (avg-Math.floor(avg)>=.75?1:avg-Math.floor(avg)>=.25?.5:0);
    $("#bcout").textContent=ov.toFixed(1); $("#bcavg").textContent="rata-rata "+avg.toFixed(3).replace(/0+$/,"").replace(/\.$/,""); };
  el.addEventListener("change",calc); calc();
}
function scaleBars(){ document.querySelectorAll(".scorebar").forEach(el=>{ const s=SCALE[el.dataset.scale];
  el.innerHTML=`<div class="scale">${s.map(([a,b,band])=>`<div><b>${band}</b><span>${a===b?a:a+"–"+b}</span></div>`).join("")}</div><p class="note">Jumlah jawaban benar dari 40 → band ${el.dataset.scale==="L"?"Listening":"Reading Academic"}.</p>`; }); }

/* ---------- after render hooks ---------- */
function after(){
  if(route==="panduan"){ bandCalc(); scaleBars(); const pq=$("#pq"); if(pq) pq.onchange=()=>{ PQ=pq.value; render(); }; }
  if(route==="vocab" && !SESS && VSUB==="rekap"){
    const rq=$("#rq"), rt=$("#rt");
    if(rq) rq.oninput=()=>{ RF.q=rq.value; $("#rlist").innerHTML=rekapRows(); };
    if(rt) rt.onchange=()=>{ RF.t=rt.value; $("#rlist").innerHTML=rekapRows(); };
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="flip"){ if(SESS&&SESS.card&&SESS.card.type==="flash"&&!SESS.card.flipped){ SESS.card.flipped=true; render(); } return; }
  if(a==="rate"){ const s=+el.dataset.s; const c=SESS.card; if(c.type==="flash") commitRate(s); else { c.sel=s; render(); } return; }
  if(a==="ans"){ const c=SESS.card; if(c.answered!==null) return; c.answered=+el.dataset.i; const ok=c.answered===c.correct, prev=status(c.id);
    c.sel = ok ? (prev>=2?3:2) : 1; render(); return; }
  if(a==="next"){ commitRate(SESS.card.sel||1); return; }
  if(a==="aiex"){ e.stopPropagation(); aiExample(); return; }
  if(a==="quit"){ SESS=null; render(); return; }
  if(a==="againweak"){ const weak=Object.keys(SESS.res).filter(id=>SESS.res[id]<3); const m=SESS.mode; SESS=null; startSession(shuffle(weak), m); return; }
  if(a==="newsess"){ SESS=null; const p=buildQueue(selTopics(),S.settings.size,S.session+1); if(p.q.length) startSession(p.q,S.settings.mode); else render(); return; }
  if(a==="quickstart"){ const p=buildQueue(selTopics(),S.settings.size,S.session+1); VSUB="belajar"; if(p.q.length) startSession(p.q,S.settings.mode); else go("vocab"); return; }
  if(a==="topic"){ S.settings.topics=[el.dataset.t]; touch(); VSUB="belajar"; SESS=null; go("vocab"); return; }
  if(a==="tt"){ let sel=selTopics(); const t=el.dataset.t; sel = sel.includes(t)? sel.filter(x=>x!==t) : sel.concat(t);
    if(sel.length) S.settings.topics=sel; else { S.settings.topics=null; toast("Minimal satu topik. Semua topik dipilih lagi."); }
    touch(); render(); return; }
  if(a==="tgroup"){ const k=el.dataset.k, ids=TOPICS.filter(t=>t.kind===k).map(t=>t.id); let sel=selTopics(); const allOn=ids.every(i=>sel.includes(i));
    sel = allOn? sel.filter(i=>!ids.includes(i)) : [...new Set(sel.concat(ids))]; S.settings.topics = sel.length? sel : null; touch(); render(); return; }
  if(a==="set"){ const k=el.dataset.k; S.settings[k]= k==="size"? +el.dataset.v : el.dataset.v; touch(); render(); return; }
  if(a==="start"){ const p=buildQueue(selTopics(),S.settings.size,S.session+1); startSession(p.q,S.settings.mode); return; }
  if(a==="vsub"){ VSUB=el.dataset.v; render(); return; }
  if(a==="rf"){ RF[el.dataset.k]=el.dataset.v; render(); return; }
  if(a==="setst"){ e.preventDefault(); setStatusOnly(el.dataset.id, +el.dataset.s); const open=el.closest("details"); const id=el.dataset.id; $("#rlist").innerHTML=rekapRows(); const d=document.querySelector(`details[data-id="${id}"]`); if(d&&open) d.open=true; return; }
  if(a==="drill"){ const L=rekapList(); if(!L.length){ toast("Daftar kosong."); return; } startSession(shuffle(L.map(w=>w.id)).slice(0,50), S.settings.mode); return; }
  if(a==="gsel"){ GSEL=el.dataset.g; render(); window.scrollTo({top:0}); return; }
  if(a==="gans"){ const q=+el.dataset.q, o=+el.dataset.o; GQ[GSEL]=GQ[GSEL]||{}; GQ[GSEL][q]=o; const g=GBY[GSEL];
    if(Object.keys(GQ[GSEL]).length===g.quiz.length){ const ok=Object.entries(GQ[GSEL]).filter(([qi,a])=>g.quiz[qi].a===a).length; const gs=S.grammar[g.id]||{}; gs.best=Math.max(gs.best||0,ok); gs.n=g.quiz.length; S.grammar[g.id]=gs; touch(); }
    const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(a==="greset"){ GQ[GSEL]={}; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(a==="gdone"){ const gs=S.grammar[GSEL]||{}; gs.done=!gs.done; S.grammar[GSEL]=gs; touch(); const y=window.scrollY; render(); window.scrollTo(0,y); if(gs.done) toast("Ditandai sudah paham"); return; }
  if(a==="gcheck"){ gCheck(); return; }
  if(a==="gstop"){ const ai=GAI[GSEL]; if(ai&&ai.ctl) ai.ctl.abort(); return; }
  if(a==="psub"){ PSUB=el.dataset.v; render(); return; }
});
document.addEventListener("keydown", e=>{
  if(route!=="vocab"||!SESS||!SESS.card) return;
  if(e.target.matches("input,textarea,select")) return;
  const c=SESS.card, k=e.key;
  if(c.type==="end") return;
  if(c.type==="flash"){
    if((k===" "||k==="Enter") && !c.flipped){ e.preventDefault(); c.flipped=true; render(); return; }
    if(c.flipped && ["1","2","3"].includes(k)){ commitRate(+k); return; }
  } else {
    if(c.answered===null){ const i="abcd".indexOf(k.toLowerCase()); if(i>=0 && i<c.opts.length){ c.answered=i; const ok=i===c.correct, prev=status(c.id); c.sel= ok?(prev>=2?3:2):1; render(); } return; }
    if(["1","2","3"].includes(k)){ c.sel=+k; render(); return; }
    if(k==="Enter"){ e.preventDefault(); commitRate(c.sel||1); }
  }
});

/* ---------- boot ---------- */
render();
initStore();
aiReady.then(()=>{ if(route==="vocab"&&SESS) paintAI(); if(route==="grammar") paintG(); });
})();
</script>

</body></html>
